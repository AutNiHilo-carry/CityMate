<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ff6633" />
    <meta
      name="description"
      content="在CityMate发现杭州好店、探店笔记和超值优惠，把日常过得有滋有味。"
    />
    <title>发现身边的好去处 · CityMate</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/icons.css" />
    <link rel="stylesheet" href="/assets/style.css" />
    <link rel="stylesheet" href="/assets/pages.css" />
    <link rel="stylesheet" href="/assets/feedback.css" />
    <link rel="stylesheet" href="/assets/experience.css" />
    <link rel="stylesheet" href="/assets/assistant.css" />
    <link rel="stylesheet" href="/assets/business-ui.css" />
    <script defer src="/vendor/vue.js"></script>
    <script type="module" src="/scripts/app.js"></script>
  </head>
  <body>
    <noscript>请启用 JavaScript，查看店铺和探店内容。</noscript>
    <div id="app" v-cloak :class="{ 'has-mobile-nav': showMobileNav }">
      <a class="skip-link" href="#main">跳到主要内容</a>
      <header class="site-header">
        <div class="header-inner">
          <a class="brand" href="/" aria-label="CityMate首页"
            ><i class="el-icon-location" aria-hidden="true"></i
            ><span>CityMate</span></a
          >
          <span class="city"
            ><i class="el-icon-location-outline" aria-hidden="true"></i
            >杭州</span
          >
          <nav class="main-nav" aria-label="主导航">
            <a href="/" :class="{ active: activeNav === 'home' }">发现</a>
            <a href="/shop-list.html" :class="{ active: activeNav === 'shops' }"
              >找店</a
            >
            <a
              href="/vouchers.html"
              :class="{ active: activeNav === 'vouchers' }"
              >优惠券</a
            >
            <a href="/assistant.html" :class="{ active: activeNav === 'assistant' }">问一问</a>
          </nav>
          <a
            class="experience-nav"
            href="/experience.html"
            :class="{ active: page === 'experience' }"
            >体验验证</a
          >
          <form class="header-search" role="search" @submit.prevent="search">
            <i class="el-icon-search" aria-hidden="true"></i>
            <input
              v-model="keyword"
              :maxlength="page === 'vouchers' ? 100 : 50"
              :aria-label="headerSearchLabel"
              :placeholder="headerSearchPlaceholder"
            />
            <button type="submit" aria-label="搜索">
              <i class="el-icon-right" aria-hidden="true"></i>
            </button>
          </form>
          <a class="mobile-ai-entry" href="/assistant.html" :aria-current="page === 'assistant' ? 'page' : null"><img src="/assets/mascots/xiaocheng-v1.png" alt="" width="24" height="24" />问一问</a>
          <a class="header-orders" href="/orders.html" :aria-current="page === 'orders' ? 'page' : null">我的订单</a>
          <a class="button outline publish-link" href="/blog-edit.html"
            ><i class="el-icon-edit-outline" aria-hidden="true"></i>发布笔记</a
          >
          <a
            v-if="user"
            class="account-link"
            href="/info.html"
            :aria-label="'个人主页：' + user.nickName"
            ><app-image
              :src="user.icon || '/imgs/icons/default-icon.png'"
              alt=""
            ></app-image
          ></a>
          <a v-else class="login-link" :href="loginHref">登录 / 注册</a>
        </div>
      </header>

      <main id="main" class="page-shell">
        <assistant-page
          v-if="page === 'assistant'"
          :api="assistantApi"
          :user="user"
          :user-ready="userReady"
        ></assistant-page>
        <experience-page
          v-else-if="page === 'experience'"
          :api="experienceApi"
          :user="user"
        ></experience-page>
        <template v-else-if="page === 'home'">
          <section class="hero" aria-labelledby="hero-title">
            <div class="hero-copy"><h1 id="hero-title">杭州吃喝玩乐</h1><p>找店、看评价，出门前查查优惠。</p></div>
            <nav class="home-shortcuts" aria-label="常用服务">
              <a href="/shop-list.html"><i class="el-icon-search" aria-hidden="true"></i>找商户</a>
              <a href="/vouchers.html"><i class="el-icon-tickets" aria-hidden="true"></i>查优惠</a>
              <a href="/orders.html"><i class="el-icon-document" aria-hidden="true"></i>我的订单</a>
              <a href="/blog-edit.html"><i class="el-icon-edit" aria-hidden="true"></i>写笔记</a>
            </nav>
          </section>
          <nav class="category-strip" aria-label="店铺分类">
            <a
              v-for="type in types"
              :key="type.id"
              :href="'/shop-list.html?type=' + type.id + '&name=' + encodeURIComponent(type.name)"
            >
              <span class="category-icon"
                ><i
                  :class="'el-icon-' + typeIcon(type.id)"
                  aria-hidden="true"
                ></i></span
              ><span>{{ type.name }}</span>
            </a>
          </nav>
          <div class="home-columns">
            <section class="feed-section" aria-labelledby="feed-title">
              <div class="section-heading">
                <h2 id="feed-title">
                  探店笔记<span class="section-emoji" aria-hidden="true">📸</span>
                </h2>
                <div class="tabs" aria-label="笔记来源">
                  <button
                    :class="{ active: feed === 'hot' }"
                    :aria-pressed="feed === 'hot'"
                    @click="changeFeed('hot')"
                  >
                    热门推荐</button
                  ><button
                    :class="{ active: feed === 'follow' }"
                    :aria-pressed="feed === 'follow'"
                    @click="changeFeed('follow')"
                  >
                    关注动态
                  </button>
                </div>
                <span class="section-caption">看看大家最近去了哪儿</span>
              </div>
              <div v-if="pageError" class="error-state" role="alert">
                <i class="el-icon-warning-outline" aria-hidden="true"></i>{{
                pageError }}<button class="text-button" :disabled="blogLoading" @click="loadBlogs(blogs.length === 0)">
                  重新加载
                </button>
              </div>
              <div v-if="(loading || blogLoading) && !blogs.length" class="blog-grid" aria-label="正在加载探店笔记" role="status">
                <div v-for="n in 6" :key="n" class="skeleton-card">
                  <div></div>
                  <span></span><span></span>
                </div>
              </div>
              <div v-else class="blog-grid">
                <blog-card
                  v-for="blog in blogs"
                  :key="blog.id"
                  :blog="blog"
                  @like="like"
                ></blog-card>
              </div>
              <div
                v-if="!loading && !blogLoading && !blogs.length && !pageError"
                class="empty-state"
              >
                <span class="empty-illustration" aria-hidden="true">📸</span>
                <h3>
                  {{ feed === 'follow' ? '还没有关注动态' :
                  '暂时没有探店笔记' }}
                </h3>
                <p>
                  {{ feed === 'follow' ?
                  '去热门推荐里发现喜欢的作者，关注后在这里查看新笔记。' :
                  '分享一次难忘的探店，让更多人发现这份美好。' }}
                </p>
                <a
                  class="button outline"
                  :href="feed === 'follow' ? '/?feed=hot' : '/blog-edit.html'"
                  >{{ feed === 'follow' ? '发现作者' : '写下第一篇笔记' }}</a
                >
              </div>
              <div v-if="blogs.length" class="load-more">
                <button
                  v-if="blogHasMore"
                  class="button soft"
                  :disabled="blogLoading"
                  @click="loadBlogs()"
                >
                  {{ blogLoading ? '正在加载…' : '再发现一些' }}<i
                    class="el-icon-arrow-down"
                    aria-hidden="true"
                  ></i></button
                ><span v-else>暂时就到这里，出去走走吧。</span>
              </div>
            </section>
            <aside class="home-aside">
              <section class="panel good-shops">
                <div class="panel-heading">
                  <h2>精选好店</h2>
                  <a href="/shop-list.html"
                    >更多<i class="el-icon-arrow-right" aria-hidden="true"></i
                  ></a>
                </div>
                <p class="panel-subtitle">按店铺评分展示</p>
                <a
                  v-for="shop in homeShops"
                  :key="shop.id"
                  class="mini-shop"
                  :href="contextLink('/shop-detail.html?id=' + shop.id)"
                  ><app-image
                    :src="images(shop.images)[0]"
                    :alt="shop.name"
                  ></app-image>
                  <div>
                    <h3>{{ shop.name }}</h3>
                    <div class="mini-rating">
                      <rating-stars :score="shop.score"></rating-stars>
                      <strong
                        >{{ shop.score == null ? '暂无评分' : (shop.score /
                        10).toFixed(1) }}</strong
                      >
                    </div>
                    <p>{{ typeName(shop.typeId) }} · {{ shop.area }}</p>
                  </div></a
                >
                <p v-if="asideError" class="muted">{{ asideError }}</p>
              </section>
              <section class="deal-panel">
                <div class="panel-heading">
                  <h2>
                    <i class="el-icon-tickets" aria-hidden="true"></i>超值优惠
                  </h2>
                  <a href="/vouchers.html"
                    >更多<i class="el-icon-arrow-right" aria-hidden="true"></i
                  ></a>
                </div>
                <template v-if="homeOffer"
                  ><p class="deal-title">{{ homeOffer.title }}</p>
                  <p class="muted">{{ homeOffer.subTitle }}</p>
                  <div class="deal-bottom">
                    <div class="deal-price">
                      ¥<strong>{{ money(homeOffer.payValue) }}</strong
                      ><span>¥{{ money(homeOffer.actualValue) }}</span>
                    </div>
                    <a
                      class="button primary small"
                      :href="contextLink('/shop-detail.html?id=' + homeOffer.shopId)"
                      >去看看</a
                    >
                  </div></template
                >
                <template v-else
                  ><p class="deal-title">查看店铺优惠券</p>
                  <p class="muted">查看店铺当前可领取的优惠券。</p>
                  <a class="text-button" href="/vouchers.html"
                    >发现优惠<i class="el-icon-right" aria-hidden="true"></i></a
                ></template>
              </section>
              <section class="service-links">
                <h3>常用入口</h3>
                <a href="/assistant.html">找店查券，问一问<i class="el-icon-arrow-right" aria-hidden="true"></i></a>
                <a href="/orders.html">我的优惠券订单<i class="el-icon-arrow-right" aria-hidden="true"></i></a>
                <a href="/blog-edit.html">发布探店笔记<i class="el-icon-arrow-right" aria-hidden="true"></i></a>
              </section>
            </aside>
          </div>
        </template>

        <template v-else-if="page === 'shops'">
          <div class="page-intro">
            <div>
              <span class="eyebrow">HANGZHOU · 好店发现</span>
              <h1>
                {{ keyword ? '关于“' + keyword + '”的好店' : currentType ?
                currentType.name : '全部商户' }}
              </h1>
              <p>按分类、商圈、评分和人均预算，找到适合你的店铺。</p>
            </div>
            <span class="result-count"
              ><template v-if="catalogLoading && catalogPage === 1">正在查找…</template><template v-else>找到 <strong>{{ catalogTotal }}</strong> 家店铺</template></span
            >
          </div>
          <form class="filter-panel" @submit.prevent="loadCatalog(true)">
            <div class="catalog-search-row"><label class="catalog-keyword"><i class="el-icon-search" aria-hidden="true"></i><input v-model="catalogKeyword" maxlength="50" aria-label="搜索店名" placeholder="输入店铺名称"></label><button type="submit" class="button primary">查找店铺</button></div>
            <div class="filter-categories">
              <span class="filter-label">分类</span
              ><button
                type="button"
                :class="{ active: !catalogType }"
                :aria-pressed="!catalogType"
                @click="catalogType = ''; loadCatalog(true)"
              >
                全部</button
              ><button
                v-for="type in types"
                :key="type.id"
                type="button"
                :class="{ active: String(type.id) === String(catalogType) }"
                :aria-pressed="String(type.id) === String(catalogType)"
                @click="catalogType = String(type.id); loadCatalog(true)"
              >
                {{ type.name }}
              </button>
            </div>
            <div class="catalog-options">
              <label>商圈 / 地址<input v-model="catalogArea" aria-label="商圈 / 地址" maxlength="50" placeholder="例如：运河、拱墅"></label>
              <label>人均预算<select v-model="catalogMaxPrice" aria-label="人均预算" @change="loadCatalog(true)"><option value="">不限</option><option v-if="catalogMaxPrice && !['50','100','200','300'].includes(String(catalogMaxPrice))" :value="catalogMaxPrice">{{ catalogMaxPrice }}元以内（链接条件）</option><option value="50">50元以内</option><option value="100">100元以内</option><option value="200">200元以内</option><option value="300">300元以内</option></select></label>
              <label>评分<select v-model="catalogMinScore" aria-label="评分" @change="loadCatalog(true)"><option value="">不限</option><option v-if="catalogMinScore && !['40','45','48'].includes(String(catalogMinScore))" :value="catalogMinScore">链接中的评分条件</option><option value="40">4.0分以上</option><option value="45">4.5分以上</option><option value="48">4.8分以上</option></select></label>
              <label class="catalog-voucher-option"><input type="checkbox" v-model="catalogHasVoucher" @change="loadCatalog(true)">只看有优惠券的店铺</label>
            </div>
            <div class="filter-sort">
              <span class="filter-label">排序</span
              ><button
                type="button"
                :class="{ active: catalogSort === 'score' }"
                :aria-pressed="catalogSort === 'score'"
                @click="catalogSort = 'score'; loadCatalog(true)"
              >
                评分优先</button
              ><button
                type="button"
                :class="{ active: catalogSort === 'price' }"
                :aria-pressed="catalogSort === 'price'"
                @click="catalogSort = 'price'; loadCatalog(true)"
              >
                价格从低到高</button
              ><button type="button" class="text-button catalog-reset" @click="resetCatalogFilters">清空筛选<i class="el-icon-close" aria-hidden="true"></i></button>
            </div>
          </form>
          <div v-if="pageError" class="error-state" role="alert">
            {{ pageError }}<button
              class="text-button"
              @click="loadCatalog(true)"
            >
              重新加载
            </button>
          </div>
          <div class="shop-grid">
            <shop-card
              v-for="shop in shops"
              :key="shop.id"
              :shop="shop"
              :type-name="typeName(shop.typeId)"
            ></shop-card
            ><template v-if="catalogLoading"
              ><div v-for="n in 3" :key="'skeleton-' + n" class="skeleton-card">
                <div></div>
                <span></span><span></span></div
            ></template>
          </div>
          <div
            v-if="!catalogLoading && !shops.length && !pageError"
            class="empty-state"
          >
            <i class="el-icon-search" aria-hidden="true"></i>
            <h3>暂时没有找到合适的店铺</h3>
            <p>试试其他关键词，或换个分类再看看。</p>
            <a href="/shop-list.html" class="button outline">查看全部好店</a>
          </div>
          <div v-if="shops.length" class="load-more">
            <button
              v-if="catalogHasMore"
              class="button soft"
              :disabled="catalogLoading"
              @click="loadCatalog()"
            >
              {{ catalogLoading ? '正在加载…' : '加载更多好店' }}</button
            ><span v-else>已经看完所有结果</span>
          </div>
        </template>

        <template v-else-if="page === 'shop' && shop">
          <a class="page-back" :href="detailBackHref"><i class="el-icon-arrow-left" aria-hidden="true"></i>{{ detailBackLabel }}</a>
          <div class="breadcrumbs">
            <a href="/">首页</a
            ><i class="el-icon-arrow-right" aria-hidden="true"></i
            ><a :href="'/shop-list.html?type=' + shop.typeId"
              >{{ typeName(shop.typeId) }}</a
            ><i class="el-icon-arrow-right" aria-hidden="true"></i
            ><span>{{ shop.name }}</span>
          </div>
          <section class="shop-detail-heading">
            <div>
              <span class="eyebrow"
                >{{ shop.area }} · {{ typeName(shop.typeId) }}</span
              >
              <h1>{{ shop.name }}</h1>
              <div class="detail-rating">
                <rating-stars :score="shop.score"></rating-stars
                ><strong
                  >{{ shop.score == null ? '暂无评分' : (shop.score /
                  10).toFixed(1) }}</strong
                ><span>{{ shop.comments || 0 }} 条评价</span
                ><span class="rating-divider"></span
                ><span
                  >人均
                  <b
                    >¥{{ shop.avgPrice == null ? '—' : shop.avgPrice }}</b
                  ></span
                >
              </div>
            </div>
            <favorite-button kind="shop" :id="shop.id" :user="user" :user-ready="userReady" :api="favoriteApi"></favorite-button>
            <a class="button outline" :href="'/blog-edit.html?shop=' + shop.id"
              ><i class="el-icon-edit-outline" aria-hidden="true"></i
              >写篇探店笔记</a
            >
          </section>
          <div class="shop-gallery">
            <button v-if="shopPictures.length" type="button" class="photo-open shop-photo-open" aria-label="放大店铺照片，第 1 张" @click="openPhotos(shopPictures, 0, shop.name)">
            <app-image
              :src="shopPictures[0]"
              :alt="shop.name"
              eager="true"
            ></app-image>
            <span class="photo-open-hint"><i class="el-icon-full-screen" aria-hidden="true"></i>查看 {{ shopPictures.length }} 张照片</span>
            </button>
            <app-image v-else src="" :alt="shop.name + '暂无照片'"></app-image>
            <div v-if="shopPictures.length > 1" class="gallery-secondary">
              <button v-for="(picture, index) in shopPictures.slice(1, 3)" :key="index" type="button" class="photo-open" :aria-label="'放大店铺照片，第 ' + (index + 2) + ' 张'" @click="openPhotos(shopPictures, index + 1, shop.name)">
              <app-image
                :src="picture"
                :alt="shop.name + '店铺照片'"
              ></app-image>
              </button>
            </div>
          </div>
          <nav class="shop-section-nav" aria-label="店铺页面内容"><a href="#shop-information">店铺信息</a><a href="#shop-vouchers">优惠券<span v-if="vouchers.length">{{ vouchers.length }}</span></a><a href="#shop-notes">探店笔记<span v-if="shopBlogsTotal">{{ shopBlogsTotal }}</span></a></nav>
          <div class="detail-columns">
            <div class="detail-main">
              <section id="shop-information" class="panel shop-information">
                <h2>店铺信息</h2>
                <div>
                  <i class="el-icon-location-outline" aria-hidden="true"></i
                  ><span
                    ><b>店铺地址</b>{{ shop.address || '地址暂未登记' }}</span
                  >
                </div>
                <div>
                  <i class="el-icon-time" aria-hidden="true"></i
                  ><span
                    ><b>营业时间</b>{{ shop.openHours || '营业时间暂未登记'
                    }}</span
                  >
                </div>
              </section>
              <section id="shop-vouchers" class="detail-section">
                <div class="section-heading">
                  <h2>店铺优惠券</h2>
                  <span class="section-caption">好价格，也要好体验</span>
                </div>
                <voucher-card
                  v-for="voucher in vouchers"
                  :key="voucher.id"
                  :voucher="voucher"
                  :busy="claimBusy === String(voucher.id)"
                  @claim="claim"
                ></voucher-card>
                <div v-if="shopVouchersLoading" class="inline-empty" role="status">正在查询店铺优惠…</div>
                <div v-if="shopVouchersError" class="error-state" role="alert">{{ shopVouchersError }}<button type="button" class="text-button" @click="loadShopVouchers">重试优惠查询</button></div>
                <div v-if="!shopVouchersLoading && !shopVouchersError && !vouchers.length" class="inline-empty">
                  这家店铺暂时没有上架优惠券。
                </div>
              </section>
              <section id="shop-notes" class="detail-section">
                <div class="section-heading">
                  <h2>大家的探店记录 <span v-if="shopBlogsTotal" class="detail-count">{{ shopBlogsTotal }} 篇</span></h2>
                  <a
                    class="text-button"
                    :href="'/blog-edit.html?shop=' + shop.id"
                    >我也来记录<i class="el-icon-right" aria-hidden="true"></i
                  ></a>
                </div>
                <div class="blog-grid">
                  <blog-card
                    v-for="blog in shopBlogs"
                    :key="blog.id"
                    :blog="blog"
                    @like="like"
                  ></blog-card>
                </div>
                <div v-if="shopBlogsError" class="error-state" role="alert">{{ shopBlogsError }}<button type="button" class="text-button" @click="loadShopBlogs">重试笔记查询</button></div>
                <div v-if="!shopBlogsLoading && !shopBlogsError && !shopBlogs.length" class="inline-empty">
                  暂时没有探店记录，你可以写下第一篇。
                </div>
                <div v-if="shopBlogsLoading" class="inline-empty" role="status">正在加载探店记录…</div>
                <div v-else-if="(shopBlogsPage - 1) * 5 < shopBlogsTotal" class="load-more"><button type="button" class="button soft" @click="loadShopBlogs">查看更多探店记录<i class="el-icon-arrow-down" aria-hidden="true"></i></button></div>
              </section>
            </div>
            <aside>
              <section class="panel detail-tip">
                <span class="eyebrow">出门前的小提醒</span>
                <h3>到店与用券须知</h3>
                <p>
                  营业时间由店铺登记。出发前建议确认营业安排，使用优惠券前查看使用规则。
                </p>
                <a href="/shop-list.html" class="text-button"
                  >再看看其他好店<i class="el-icon-right" aria-hidden="true"></i
                ></a>
              </section>
            </aside>
          </div>
        </template>

        <template v-else-if="page === 'blog' && blog">
          <a class="page-back" :href="detailBackHref"><i class="el-icon-arrow-left" aria-hidden="true"></i>{{ detailBackLabel }}</a>
          <div class="breadcrumbs">
            <a href="/">发现</a
            ><i class="el-icon-arrow-right" aria-hidden="true"></i
            ><span>探店笔记</span>
          </div>
          <article class="note-layout">
            <div class="note-gallery">
              <div class="note-photo-stage">

              </p>
              <label for="shop-query">关联你探访的店铺</label>
              <div class="shop-picker-search">
                <input
                  id="shop-query"
                  v-model="shopQuery"
                  maxlength="50"
                  placeholder="输入店铺名称，搜索后选择"
                /><button
                  type="button"
                  class="button soft"
                  :disabled="publishShopLoading"
                  @click="loadPublishShops"
                >
                  搜索店铺
                </button>
              </div>
              <select
                id="note-shop"
                v-model="draft.shopId"
                :disabled="publishShopLoading || publishBusy"
                required
                aria-label="关联店铺"
              >
                <option disabled value="">请选择关联店铺</option>
                <option
                  v-for="shop in publishShops"
                  :key="shop.id"
                  :value="String(shop.id)"
                >
                  {{ shop.name }} · {{ shop.area }}
                </option>
              </select>
              <p v-if="publishShopError" class="publish-shop-error" role="alert">{{ publishShopError }}</p>
              <p
                v-if="!publishShopLoading && !publishShops.length"
                class="muted"
              >
                没有找到匹配店铺，试试其他关键词。
              </p>
              <div class="publish-actions">
                <div class="publish-secondary"><a href="#note-preview" class="button soft">预览笔记</a><button type="button" class="text-button" :disabled="publishBusy || uploadBusy" @click="draftDiscardConfirm = true">清空草稿</button></div><button
                  type="submit"
                  class="button primary"
                  :disabled="publishBusy || uploadBusy || publishUncertain || publishShopLoading || !draftStorageReady"
                >
                  {{ publishBusy ? '正在发布…' : '发布笔记' }}<i
                    class="el-icon-right"
                    aria-hidden="true"
                  ></i>
                </button>
              </div>
              <div v-if="draftDiscardConfirm" class="draft-discard-confirm" role="alert"><p>清空当前草稿的文字和照片选择？此操作不能撤销。</p><button type="button" class="button outline small" @click="clearLocalDraft">确认清空</button><button type="button" class="text-button" @click="draftDiscardConfirm = false">继续编辑</button></div>
            </form>
            <aside id="note-preview" class="note-publish-preview">
              <div class="preview-heading"><h2>笔记预览</h2><span>随编辑实时更新</span></div>
              <article class="publish-preview-card"><app-image v-if="draft.pictures.length" :src="draft.pictures[0]" alt="笔记封面预览"></app-image><div v-else class="preview-no-photo"><i class="el-icon-picture-outline" aria-hidden="true"></i><span>添加照片后显示封面</span></div><div class="publish-preview-body"><h3>{{ draft.title || '你的笔记标题' }}</h3><p>{{ draft.content || '记录菜品、环境和你的真实感受。' }}</p><div class="preview-author"><app-image :src="user.icon || '/imgs/icons/default-icon.png'" alt=""></app-image><span>{{ user.nickName || '我' }}</span></div><div class="preview-shop"><i class="el-icon-location-outline" aria-hidden="true"></i>{{ publishShopName }}</div></div></article>
              <p class="preview-privacy">草稿仅保存在此浏览器，按账号分别保存。换设备不会自动同步；图片以服务器实际可用状态为准。</p>
            </aside>
          </div>
        </template>

        <div
          v-if="loading && !['home', 'login', 'shops', 'vouchers', 'experience'].includes(page)"
          class="empty-state"
          role="status"
        >
          <span class="spinner"></span>
          <p>正在加载…</p>
        </div>
        <div
          v-if="pageError && page !== 'home' && page !== 'shops'"
          class="empty-state error-state"
          role="alert"
        >
          <h2>内容暂时无法加载</h2>
          <p>{{ pageError }}</p>
          <button class="button outline" @click="reload">重新加载</button>
        </div>
        <div v-if="page === 'not-found'" class="empty-state">
          <h1>页面不存在</h1>
          <p>回到首页，继续发现杭州的好去处。</p>
          <a href="/" class="button primary">返回首页</a>
        </div>
      </main>

      <photo-viewer v-if="photoViewer" :pictures="photoViewer.pictures" :start-index="photoViewer.index" :title="photoViewer.title" @close="photoViewer = null" @change="page === 'blog' && (galleryIndex = $event)"></photo-viewer>
      <nav v-if="showMobileNav" class="mobile-bottom-nav" aria-label="手机主导航">
        <a href="/" :aria-current="['home','blog'].includes(page) ? 'page' : null"><i class="el-icon-discover" aria-hidden="true"></i><span>发现</span></a>
        <a href="/shop-list.html" :aria-current="['shops','shop'].includes(page) ? 'page' : null"><i class="el-icon-location-outline" aria-hidden="true"></i><span>找店</span></a>
        <a href="/vouchers.html" :aria-current="page === 'vouchers' ? 'page' : null"><i class="el-icon-tickets" aria-hidden="true"></i><span>优惠券</span></a>
        <a href="/orders.html" :aria-current="page === 'orders' ? 'page' : null"><i class="el-icon-document" aria-hidden="true"></i><span>订单</span></a>
        <a href="/info.html" :aria-current="page === 'profile' && isOwnProfile ? 'page' : null"><i class="el-icon-user" aria-hidden="true"></i><span>我的</span></a>
      </nav>
      <footer class="site-footer">
        <a class="footer-brand" href="/"
          >CityMate<span>杭州本地生活</span></a
        >
        <div>
          <a href="/shop-list.html">发现好店</a><span>·</span
          ><a href="/vouchers.html">超值优惠</a><span>·</span
          ><a href="/blog-edit.html">发布笔记</a><span>·</span><a href="/experience.html">工程体验</a>
        </div>
        <span>商户 · 优惠券 · 探店笔记</span>
      </footer>
      <transition name="toast"
        ><div
          v-if="toast"
          class="toast-message"
          :class="toast.kind"
          role="status"
        >
          <i
            :class="toast.kind === 'error' ? 'el-icon-warning-outline' : 'el-icon-circle-check'"
            aria-hidden="true"
          ></i
          >{{ toast.message }}<button
            class="icon-button"
            aria-label="关闭提示"
            @click="toast = null"
          >
            <i class="el-icon-close" aria-hidden="true"></i>
          </button></div
      ></transition>
      <div
        v-if="dialog"
        class="dialog-overlay"
        @click.self="dialog = null"
        @keydown.esc="dialog = null"
      >
        <section
          ref="dialogPanel"
          @keydown.tab="trapDialog"
          class="dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="dialog-title"
        >
          <button
            class="dialog-close icon-button"
            aria-label="关闭"
            @click="dialog = null"
          >
            <i class="el-icon-close" aria-hidden="true"></i></button
          ><span class="dialog-icon"
            ><i class="el-icon-tickets" aria-hidden="true"></i></span
          ><template v-if="dialog.kind === 'claim'"
            ><h2 id="dialog-title">
              {{ Number(dialog.voucher.payValue) === 0 ? '确认领取优惠券' :
              '确认创建优惠券订单' }}
            </h2>
            <p>{{ dialog.voucher.title }}</p>
            <div class="dialog-price">
              ¥{{ money(dialog.voucher.payValue) }}
            </div>
            <p class="dialog-rules">
              {{ (dialog.voucher.rules ||
              '具体使用规则以店铺说明为准').replace(/\\n/g, '\n') }}
            </p>
            <p class="muted">
              {{ dialog.voucher.type ?
              '提交后会确认领取结果，请在我的订单查看状态。' :
              Number(dialog.voucher.payValue) === 0 ?
              '领取后可在我的订单查看优惠券。' :
              '确认后仅创建待付款订单，尚未支付。当前页面未接入在线支付。' }}
            </p>
            <div class="dialog-actions">
              <button class="button soft" @click="dialog = null">再想想</button
              ><button class="button primary" :disabled="!!claimBusy" @click="confirmClaim">
                {{ claimBusy ? '正在核对…' : Number(dialog.voucher.payValue) === 0 ? '确认领取' : '确认创建订单' }}
              </button>
            </div></template
          ><template v-else
            ><h2 id="dialog-title">确认取消这笔订单？</h2>
            <p>{{ dialog.order.title }}</p>
            <p class="muted">仅取消当前未付款的普通券订单。</p>
            <div class="dialog-actions">
              <button class="button soft" @click="dialog = null">
                保留订单</button
              ><button class="button primary" @click="confirmCancel">
                确认取消
              </button>
            </div></template
          >
        </section>
      </div>
    </div>
  </body>
</html>
